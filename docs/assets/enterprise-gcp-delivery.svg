  <text x="64" y="106" font-family="Arial, sans-serif" font-size="14" fill="#C8D0DC">Scheduled workloads • guarded model use • deterministic controls • reversible operations</text>
  <rect x="939" y="31" width="220" height="66" rx="12" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".22"/>

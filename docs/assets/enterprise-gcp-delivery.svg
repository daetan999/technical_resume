<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Production intelligence automation on Google Cloud</title>
  <desc id="desc">Sanitized architecture showing scheduled triggers, Cloud Run execution, source ingestion, Gemini curation, deterministic controls, BigQuery audience management, SendGrid delivery, and measured outcomes.</desc>
  <defs>

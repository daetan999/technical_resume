<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic enterprise intelligence outputs</title>
  <desc id="desc">Recreated newsletter and property-performance email outputs using synthetic content and data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="1" stop-color="#E9EDF4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#172033" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="690" rx="22" fill="url(#bg)"/>
  <text x="48" y="55" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" fill="#C8102E">SYNTHETIC OUTPUT RECONSTRUCTION</text>
  <text x="48" y="90" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1D2634">From governed cloud workflow to executive-ready delivery</text>
  <text x="48" y="116" font-family="Arial, sans-serif" font-size="13" fill="#667286">Illustrative hierarchy only • no internal screenshots, recipients, properties, or data</text>

  <g filter="url(#shadow)">
    <rect x="48" y="145" width="528" height="496" rx="18" fill="#FFFFFF"/>
    <rect x="624" y="145" width="528" height="496" rx="18" fill="#FFFFFF"/>
  </g>

  <rect x="48" y="145" width="528" height="86" rx="18" fill="#202938"/>
  <rect x="48" y="213" width="528" height="18" fill="#202938"/>
  <rect x="72" y="169" width="4" height="38" rx="2" fill="#C8102E"/>
  <text x="91" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#F2A6B3">WEEKLY INTELLIGENCE BRIEF</text>
  <text x="91" y="202" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">AI &amp; Hospitality Signals</text>
  <rect x="458" y="168" width="91" height="28" rx="14" fill="#C8102E"/>
  <text x="503.5" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">READY • 5/5</text>

  <text x="72" y="267" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#7A8494">EXECUTIVE NOTE</text>
  <text x="72" y="292" font-family="Arial, sans-serif" font-size="13" fill="#354153">Enterprise buyers are shifting from model access to governed</text>
  <text x="72" y="311" font-family="Arial, sans-serif" font-size="13" fill="#354153">deployment, predictable inference cost, and measurable operating value.</text>
  <line x1="72" y1="333" x2="552" y2="333" stroke="#E0E5EC"/>

  <circle cx="88" cy="374" r="16" fill="#FCE8EC"/>
  <text x="88" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#C8102E">01</text>
  <text x="116" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202938">Shared inference pools move into procurement reviews</text>
  <text x="116" y="385" font-family="Arial, sans-serif" font-size="11" fill="#697587">Why it matters: utilization and p99 now shape the business case.</text>
  <circle cx="88" cy="429" r="16" fill="#EAF2FD"/>
  <text x="88" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2F65A7">02</text>
  <text x="116" y="420" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202938">Feature freshness becomes a revenue-system dependency</text>
  <text x="116" y="440" font-family="Arial, sans-serif" font-size="11" fill="#697587">Why it matters: stale inputs delay pricing and operating action.</text>
  <circle cx="88" cy="484" r="16" fill="#E8F7EE"/>
  <text x="88" y="489" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#287A46">03</text>
  <text x="116" y="475" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202938">Governance shifts from policy document to runtime control</text>
  <text x="116" y="495" font-family="Arial, sans-serif" font-size="11" fill="#697587">Why it matters: models narrate; deterministic code decides.</text>

  <rect x="72" y="534" width="480" height="76" rx="11" fill="#F7F8FA" stroke="#E0E5EC"/>
  <text x="91" y="559" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#7A8494">DELIVERY CONTROL</text>
  <text x="91" y="582" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#303C4C">5 articles • date-valid • recipients resolved • HTTP 202 accepted</text>

  <rect x="624" y="145" width="528" height="86" rx="18" fill="#8E172A"/>
  <rect x="624" y="213" width="528" height="18" fill="#8E172A"/>
  <text x="648" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#F9C5CE">WEEKLY PROPERTY PERFORMANCE</text>
  <text x="648" y="202" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Harbour Residence • Week 27</text>
  <rect x="1032" y="168" width="92" height="28" rx="14" fill="#FFFFFF" fill-opacity=".15" stroke="#FFFFFF" stroke-opacity=".35"/>
  <text x="1078" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">SYNTHETIC</text>

  <text x="648" y="263" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#7A8494">WEEK AT A GLANCE</text>
  <rect x="648" y="282" width="146" height="90" rx="12" fill="#F7F8FA" stroke="#E0E5EC"/>
  <rect x="815" y="282" width="146" height="90" rx="12" fill="#F7F8FA" stroke="#E0E5EC"/>
  <rect x="982" y="282" width="146" height="90" rx="12" fill="#F7F8FA" stroke="#E0E5EC"/>
  <text x="668" y="307" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing=".8" fill="#7A8494">OCCUPANCY</text>
  <text x="668" y="342" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202938">82.4%</text>
  <text x="668" y="360" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#287A46">+3.1 pts vs LY</text>
  <text x="835" y="307" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing=".8" fill="#7A8494">ADR</text>
  <text x="835" y="342" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202938">S$214</text>
  <text x="835" y="360" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#287A46">+4.8% vs LY</text>
  <text x="1002" y="307" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing=".8" fill="#7A8494">REVPAR</text>
  <text x="1002" y="342" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202938">S$176</text>
  <text x="1002" y="360" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#287A46">+8.0% vs LY</text>

  <text x="648" y="411" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#7A8494">MANAGEMENT NARRATIVE</text>
  <rect x="648" y="430" width="480" height="95" rx="12" fill="#FFF7F8" stroke="#EDC3CA"/>
  <rect x="648" y="430" width="5" height="95" rx="2.5" fill="#C8102E"/>
  <text x="671" y="457" font-family="Arial, sans-serif" font-size="13" fill="#354153">RevPAR improved on both occupancy and rate. Near-term pickup is</text>
  <text x="671" y="477" font-family="Arial, sans-serif" font-size="13" fill="#354153">strongest for weekends; weekday pace remains the main variance to</text>
  <text x="671" y="497" font-family="Arial, sans-serif" font-size="13" fill="#354153">monitor. Narrative is restricted to the precomputed KPI set.</text>

  <rect x="648" y="548" width="480" height="62" rx="11" fill="#F0F5FA" stroke="#CCD8E5"/>
  <text x="671" y="573" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#607086">DATA CONTROL</text>
  <text x="671" y="593" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#303C4C">BigQuery calculates KPIs • model explains computed results only</text>
</svg>
